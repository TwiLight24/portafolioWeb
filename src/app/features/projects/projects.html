<section class="projects-section">
  <div class="container">
    <div class="projects-header reveal-left" appRevealOnScroll revealDelay="100ms">
      <p class="section-tag">Proyectos</p>

      <h1>Soluciones desarrolladas para procesos empresariales.</h1>

      <p>
        Una selección de proyectos enfocados en automatización, integración,
        reportes, aplicaciones empresariales y soluciones conectadas a SAP Business One.
      </p>
    </div>

    <div class="projects-grid" appRevealOnScroll revealDelay="200ms">
      @for (project of projects(); track project.id) {
        <app-project-card [project]="project" />
      }
    </div>
  </div>
</section>
